name: OpenStick MSM8916 kernel

on:
  workflow_dispatch:
  push:
    branches:
      - openstick/msm8916-7.0-debian13
    paths:
      - '.github/workflows/openstick-kernel.yml'
      - 'arch/arm64/configs/openstick_msm8916.fragment'
      - 'arch/arm64/boot/dts/qcom/**'
      - 'drivers/**'
      - 'include/**'
      - 'kernel/**'
      - 'net/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential flex gcc-aarch64-linux-gnu \
            libelf-dev libssl-dev device-tree-compiler dwarves kmod

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make O=out msm8916_defconfig
          scripts/kconfig/merge_config.sh -m -O out \
            out/.config arch/arm64/configs/openstick_msm8916.fragment
          make O=out olddefconfig
          for expected in \
            CONFIG_USB_ACM=y \
            CONFIG_USB_SERIAL=m \
            CONFIG_USB_SERIAL_OPTION=m \
            CONFIG_USB_USBNET=m \
            CONFIG_USB_NET_CDCETHER=m \
            CONFIG_USB_NET_CDC_MBIM=m \
            CONFIG_USB_NET_QMI_WWAN=m \
            CONFIG_USB_WDM=m \
            CONFIG_ZRAM=m \
            CONFIG_ZRAM_BACKEND_LZ4=y \
            CONFIG_ZRAM_DEF_COMP_LZ4=y; do
            grep -qx "$expected" out/.config || { echo "Missing config: $expected"; exit 1; }
          done
          for disabled in CONFIG_BT CONFIG_SOUND CONFIG_NFC; do
            grep -qx "# $disabled is not set" out/.config || { echo "Not disabled: $disabled"; exit 1; }
          done

      - name: Build kernel, modules, and device trees
        run: |
          set -euo pipefail
          make -j"$(nproc)" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz modules dtbs

      - name: Install and validate modules
        shell: bash
        run: |
          set -euo pipefail
          release="$(make -s O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease)"
          modroot="$RUNNER_TEMP/modules-root"
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$modroot" modules_install
          depmod -b "$modroot" "$release"
          for module in usbserial option zram; do
            modinfo -b "$modroot" "$module" >/dev/null
            modprobe -d "$modroot" -S "$release" -n "$module"
          done
          test -s "$modroot/lib/modules/$release/modules.dep"
          printf '%s\n' "$release" > out/kernel-release.txt

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          release="$(cat out/kernel-release.txt)"
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/
          cp out/arch/arm64/boot/Image.gz artifacts/
          cp out/arch/arm64/boot/dts/qcom/msm8916-thwc-ufi001c.dtb artifacts/
          cp out/arch/arm64/boot/dts/qcom/msm8916-xiaoxun-jz0145-v33.dtb artifacts/
          cp out/.config artifacts/kernel.config
          cp arch/arm64/configs/openstick_msm8916.fragment artifacts/
          cp out/kernel-release.txt artifacts/
          cp "$RUNNER_TEMP/modules-root/lib/modules/$release/modules.dep" artifacts/
          tar -C "$RUNNER_TEMP/modules-root" -czf "artifacts/modules-$release.tar.gz" \
            "lib/modules/$release"
          git rev-parse HEAD > artifacts/source-commit.txt
          sha256sum artifacts/* > artifacts/SHA256SUMS

      - name: Upload kernel build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openstick-msm8916-7.0-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
